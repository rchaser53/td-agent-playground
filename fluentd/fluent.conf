<source>
  @type forward
  port 24224
  bind 0.0.0.0
</source>

<match **>
  @type elasticsearch

  host elasticsearch
  port 9200
  scheme http
  logstash_format true
  logstash_prefix td-agent-test

  include_tag_key true
  tag_key fluentd_tag

  <buffer>
    flush_interval 1s
  </buffer>
</match>

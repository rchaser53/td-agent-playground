<source>
  @type forward
  port 24224
  bind 0.0.0.0
</source>

<filter nginx.raw>
  @type parser
  key_name message
  reserve_data false
  emit_invalid_record_to_error true

  <parse>
    @type nginx
  </parse>
</filter>

<match nginx.raw>
  @type elasticsearch

  host elasticsearch
  port 9200
  scheme http
  logstash_format true
  logstash_prefix nginx-access

  include_tag_key true
  tag_key fluentd_tag

  <buffer>
    flush_interval 1s
  </buffer>
</match>

<match **>
  @type elasticsearch

  host elasticsearch
  port 9200
  scheme http
  logstash_format true
  logstash_prefix td-agent-test

  include_tag_key true
  tag_key fluentd_tag

  <buffer>
    flush_interval 1s
  </buffer>
</match>

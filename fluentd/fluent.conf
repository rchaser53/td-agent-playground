<source>
  @type forward
  port 24224
  bind 0.0.0.0
</source>

<source>
  @type tail
  path /var/log/nginx/access.log
  pos_file /var/log/td-agent/nginx-access.log.pos
  tag nginx.access
  read_from_head true

  <parse>
    @type nginx
  </parse>
</source>

<match nginx.access>
  @type elasticsearch

  host elasticsearch
  port 9200
  scheme http
  logstash_format true
  logstash_prefix nginx-access

  include_tag_key true
  tag_key fluentd_tag

  <buffer>
    flush_interval 1s
  </buffer>
</match>

<match **>
  @type elasticsearch

  host elasticsearch
  port 9200
  scheme http
  logstash_format true
  logstash_prefix td-agent-test

  include_tag_key true
  tag_key fluentd_tag

  <buffer>
    flush_interval 1s
  </buffer>
</match>
